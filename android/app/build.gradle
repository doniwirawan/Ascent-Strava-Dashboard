plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// Release signing comes from keystore.properties when it exists; without it the
// release build falls back to the debug key so `assembleRelease` always works.
def keystoreProps = new Properties()
def keystoreFile = rootProject.file('keystore.properties')
if (keystoreFile.exists()) keystoreFile.withInputStream { keystoreProps.load(it) }

android {
    namespace 'xyz.doniwirawan.ascent'
    compileSdk 34

    defaultConfig {
        applicationId "xyz.doniwirawan.ascent"
        minSdk 29
        targetSdk 34
        versionCode 3
        versionName "2.0"

        // Data comes from the personal API with a token typed into the app, so
        // nothing personal is baked into the APK.
        buildConfigField "String", "API_BASE", "\"https://ascent-analytics.doniwirawan.xyz/api/v1/\""
        buildConfigField "String", "TOKEN_ENDPOINT", "\"https://ascent-analytics.doniwirawan.xyz/api/strava-token\""
        buildConfigField "String", "DASHBOARD_URL", "\"https://ascent-analytics.doniwirawan.xyz/\""
    }

    signingConfigs {
        release {
            if (keystoreProps['storeFile']) {
                storeFile rootProject.file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig keystoreProps['storeFile'] ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
    buildFeatures { buildConfig true }
}

dependencies {
    // Only for FileProvider, which the story-card share sheet needs.
    implementation 'androidx.core:core-ktx:1.13.1'
}
