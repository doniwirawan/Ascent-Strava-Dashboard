plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// -Ppersonal builds a ready-to-use APK for the owner's own phone: it carries a
// Personal API token from personal.properties (gitignored, API_TOKEN=asc_…), so
// the app opens straight into the data with no setup. That APK can read all of
// the owner's data — never publish it. Plain builds carry no token.
def personalProps = new Properties()
def personalFile = rootProject.file('personal.properties')
if (project.hasProperty('personal') && personalFile.exists()) personalFile.withInputStream { personalProps.load(it) }
def bakedApiToken = (personalProps['API_TOKEN'] ?: '').trim()

// Release signing comes from keystore.properties when it exists; without it the
// release build falls back to the debug key so `assembleRelease` always works.
def keystoreProps = new Properties()
def keystoreFile = rootProject.file('keystore.properties')
if (keystoreFile.exists()) keystoreFile.withInputStream { keystoreProps.load(it) }

android {
    namespace 'xyz.doniwirawan.ascent'
    compileSdk 34

    defaultConfig {
        applicationId "xyz.doniwirawan.ascent"
        minSdk 29
        targetSdk 34
        versionCode 9
        versionName "2.6"

        // Data comes from the personal API with a token typed into the app, so
        // nothing personal is baked into the APK (unless built with -Ppersonal).
        buildConfigField "String", "BAKED_API_TOKEN", "\"${bakedApiToken}\""
        buildConfigField "String", "API_BASE", "\"https://ascent-analytics.doniwirawan.xyz/api/v1/\""
        buildConfigField "String", "TOKEN_ENDPOINT", "\"https://ascent-analytics.doniwirawan.xyz/api/strava-token\""
        buildConfigField "String", "DASHBOARD_URL", "\"https://ascent-analytics.doniwirawan.xyz/\""
    }

    signingConfigs {
        release {
            if (keystoreProps['storeFile']) {
                storeFile rootProject.file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig keystoreProps['storeFile'] ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
    buildFeatures { buildConfig true }
}

dependencies {
    // Only for FileProvider, which the story-card share sheet needs.
    implementation 'androidx.core:core-ktx:1.13.1'
    // Health Connect: watch sleep written by apps like JoyoFit (HealthSync.kt)
    implementation 'androidx.health.connect:connect-client:1.1.0-alpha07'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'   // android.jar's org.json is a stub in unit tests
}
