<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Connecting iGPSPORT… — Ascent</title>
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/png" href="/icon.png" />
  <style>
    :root { --orange: #FC4C02; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0c0c0c; color: #f0f0f0;
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh; flex-direction: column; gap: 20px; padding: 0 16px;
    }
    .logo { font-size: 22px; font-weight: 800; color: var(--orange); }
    .msg { font-size: 15px; color: #888; text-align: center; max-width: 400px; line-height: 1.6; }
    .error { color: #f87171; }
    a { color: var(--orange); }
  </style>
</head>
<body>
  <div class="logo">Ascent</div>
  <div class="msg" id="msg"></div>
  <a href="/">Back to Ascent</a>

  <script>
    // iGPSPORT OAuth redirect target. The code → token exchange is added once
    // iGPSPORT issues the client credentials; until then this only reports back.
    const params = new URLSearchParams(window.location.search);
    const msg = document.getElementById('msg');
    if (params.get('error') || !params.get('code')) {
      msg.className = 'msg error';
      msg.textContent = params.get('error') === 'access_denied'
        ? 'You denied access to iGPSPORT. Close this tab and try again.'
        : 'No authorization code received from iGPSPORT. Please try again.';
    } else {
      msg.textContent = 'iGPSPORT authorization received. Automatic ride import is coming soon.';
    }
  </script>
</body>
</html>
